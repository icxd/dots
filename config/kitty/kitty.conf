# shinrai · kitty
# Pure black like the desktop, light grey text, and only muted hints of color
# where they carry meaning (errors, git diffs). The white island stays the
# brightest thing on screen.
# Reload after editing: ctrl+shift+F5 · Check: kitty --debug-config

# ---- type ----
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.5
# a little air between lines
modify_font       cell_height 112%
# ligatures everywhere except under the cursor, so you can see what you edit
disable_ligatures cursor

# ---- window ----
window_padding_width    18 22
hide_window_decorations yes
confirm_os_window_close 0
background_opacity      1.0

# splits: ctrl+shift+\ side by side, ctrl+shift+- one above the other,
# alt+arrows to move between them, ctrl+shift+z to zoom one
enabled_layouts       splits, stack
window_border_width   1pt
draw_minimal_borders  yes
active_border_color   #3f3f46
inactive_border_color #18181b
# the split you're not in fades back a little
inactive_text_alpha   0.6

map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+z         toggle_layout stack
map alt+left             neighboring_window left
map alt+right            neighboring_window right
map alt+up               neighboring_window up
map alt+down             neighboring_window down

# ---- cursor: a thin beam that breathes, and glides when it jumps ----
cursor_shape                 beam
cursor_beam_thickness        1.6
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   15
cursor_trail                 3
cursor_trail_decay           0.08 0.3
cursor_trail_start_threshold 3

# ---- behaviour ----
scrollback_lines     10000
enable_audio_bell    no
visual_bell_duration 0
mouse_hide_wait      2.0
url_style            straight
shell_integration    enabled

# ---- tabs: only with two or more, the current one a white pill ----
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           ""
tab_bar_min_tabs        2
tab_bar_margin_height   8 0
tab_title_template      " {index}  {title} "
active_tab_font_style   bold
active_tab_foreground   #000000
active_tab_background   #e4e4e7
inactive_tab_foreground #71717a
inactive_tab_background #000000
tab_bar_background      #000000

# ---- colors ----
foreground            #e4e4e7
background            #000000
selection_foreground  #000000
selection_background  #d4d4d8
cursor                #ffffff
cursor_text_color     #000000
url_color             #a1a1aa

# black
color0  #18181b
color8  #52525b
# red
color1  #d4a5a5
color9  #e5bcbc
# green
color2  #a8c4a8
color10 #bed6be
# yellow
