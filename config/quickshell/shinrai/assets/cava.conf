; shinrai · cava feed for the island's waveform (not for running cava by hand).
; One line per frame on stdout: 12 numbers from 0 to 1000, separated by ';'.
; Quickshell starts it only while music plays. If CPU use is high (software
; rendering in a VM), lower the framerate.

[general]
framerate = 60
autosens = 1
bars = 12
lower_cutoff_freq = 40
higher_cutoff_freq = 12000
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
