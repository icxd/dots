[General]
# The picture behind everything, relative to this folder.
# install.sh copies the desktop's wallpaper here as background.png.
background=background.png

# Your monitors' scale in hyprland.lua, so the island here is the same size as
# on the desktop (the login screen can't ask Hyprland). install.sh sets it from
# the running desktop, or keeps the last value if Hyprland isn't running.
scale=1
