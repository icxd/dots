# shinrai · hypridle

general {
    lock_cmd = pidof hyprlock || ~/.local/bin/shinrai-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sh ~/.config/hypr/scripts/dpms.sh on
}

# lock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screen off after 15 minutes
listener {
    timeout = 900
    on-timeout = sh ~/.config/hypr/scripts/dpms.sh off
    on-resume = sh ~/.config/hypr/scripts/dpms.sh on
}
