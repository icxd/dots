# shinrai · hyprlock (hyprlock keeps the classic hyprlang syntax)
#
# The lock screen is the desktop at rest: the wallpaper, and the island at the
# top showing the time. Start typing and the island turns into the password
# field (dots); a wrong password stretches it to say so. Nothing else.
#
# Sizes: hyprlock draws in the screen's real pixels and ignores the monitor's
# scale, so every size below is written for scale 1 and multiplied by $scale:
# {{108 * $scale}} is 108 at scale 1, 216 at scale 2. Locking goes through
# ~/.local/bin/shinrai-lock, which sets $scale to the scale of the monitor
# you're on, so this file never needs editing for a new screen.
# Font sizes are points (×1.33 = pixels); they're in the text's <span> so
# they can scale too.
#
# Try it: Super + L, or run `shinrai-lock` in a terminal; your password unlocks it.

$scale = 1

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
    # The fade in and out blends with a snapshot of your desktop (windows
    # dissolve, the wallpaper and island stay). Take that snapshot on the CPU:
    # the GPU way (0) crashes hyprlock inside a VM ("invalid arguments for
    # zwlr_screencopy"). If it ever still fails, use disable_screencopy = true
    # instead (it then fades from black).
    screencopy_mode = 1
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, out
    animation = fadeOut, 1, 4, out
    animation = inputFieldFade, 1, 3, out
    animation = inputFieldWidth, 1, 4, out
    animation = inputFieldColors, 1, 3, out
    animation = inputFieldDots, 1, 2, out
}

# monitor = (empty) on every widget: each screen gets the same lock screen.
background {
    monitor =
    path = ~/.config/shinrai/wallpaper.png
    color = rgb(000000)
}

# ---- the island: a white pill with the time ----
shape {
    monitor =
    size = {{108 * $scale}}, {{32 * $scale}}
    color = rgb(ffffff)
    rounding = -1
    border_size = 0
    position = 0, {{-8 * $scale}}
    halign = center
    valign = top
    zindex = 0
}

label {
    monitor =
    text = <span font_weight="600" font_size="{{10.5 * $scale}}pt">$TIME</span>
    color = rgb(0b0b0c)
    font_family = Inter
    position = 0, {{-15.5 * $scale}}
    halign = center
    valign = top
    zindex = 1
}

# the date, quietly under it
label {
    monitor =
    text = cmd[update:60000] date +"<span font_size='{{8.5 * $scale}}pt'>%A %-d %B</span>"
    color = rgba(ffffff8c)
    font_family = Inter
    position = 0, {{-50 * $scale}}
    halign = center
    valign = top
    zindex = 1
}

# ---- the password: lies over the island, invisible until you type ----
input-field {
    monitor =
    size = {{108 * $scale}}, {{32 * $scale}}
    rounding = -1
    outline_thickness = 0
    inner_color = rgb(ffffff)
    font_color = rgb(0b0b0c)
    font_family = Inter
    dots_size = 0.17
    dots_spacing = 0.6
    dots_center = true

    fade_on_empty = true
    fade_timeout = 1800   # ms before an empty field fades back to the time
    placeholder_text =

    # while checking: a hint of grey · caps lock on: a darker grey
    check_color = rgb(e4e4e7)
    capslock_color = rgb(d4d4d8)
    # wrong: the pill stretches to fit the words, then fades back to the time
    fail_color = rgb(ffffff)
    fail_text = <span font_weight="600" font_size="{{9 * $scale}}pt">Wrong password</span>

    position = 0, {{-8 * $scale}}
    halign = center
    valign = top
    zindex = 2
}
